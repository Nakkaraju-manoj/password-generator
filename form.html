<body>
    <center style="background-color: brown;"> <h1> Student Details</h1> </center> <hr>
        <form>
            <lable> Name of the Student</lable>

            <label> Courses</label>

            <input type="file">
            <p> Size of the photo must in between 50-100kb</p><br>
